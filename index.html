<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>myClassBlueprint.log</title>
<meta name="description" content="授業の予定と記録を管理するアプリ。データはこのリポジトリのJSONに保存されます。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>
<div class="wrap">
  <div class="topbar">
  <header class="hero">
    <div class="brand" role="link" tabindex="0" data-home="1" title="トップ（今日）へ" aria-label="トップ（今日）へ">
      <div>
        <h1>myClassBlueprint.log</h1>
        <div class="sub" id="sub">読み込み中…</div>
      </div>
    </div>
    <div class="tools">
      <label class="asof" for="term" id="termwrap" hidden>学期<select id="term"></select></label>
      <label class="asof" for="asof">基準日<input type="date" id="asof"></label>
      <button class="btn ghost" data-act="settings" id="btn-settings">設定</button>
    </div>
  </header>
  <div class="modebar" role="group" aria-label="授業と校務の切り替え">
    <div class="seg modeseg"><button data-act="mode" data-v="class" id="mode-class" aria-pressed="true">授業</button><button data-act="mode" data-v="work" id="mode-work" aria-pressed="false">校務</button></div>
  </div>
  <div class="tabbar" id="classtabs">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-today" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg><span>今日</span></button>
      <button class="tab" role="tab" id="tab-plan" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg><span>計画表</span></button>
      <button class="tab" role="tab" id="tab-grid" data-tab="grid"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="M3.5 10h17M9.2 5.5v13M14.8 5.5v13"/></svg><span>一覧</span></button>
      <button class="tab" role="tab" id="tab-unit" data-tab="unit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg><span>単元別</span></button>
      <button class="tab" role="tab" id="tab-sum" data-tab="sum"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>サマリー</span></button>
      <button class="tab" role="tab" id="tab-lib" data-tab="lib"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10.5a2.5 2.5 0 0 1 2.5 2.5v13H7.5A2.5 2.5 0 0 1 5 17.5z"/><path d="M5 17.5A2.5 2.5 0 0 1 7.5 15H18M9 8.5h5"/></svg><span>資料</span></button>
    </div>
  </div>
  <div class="tabbar" id="worktabs" hidden>
    <div class="tabs wtabs" role="tablist">
      <button class="tab" role="tab" data-wtab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-6h4v6"/></svg><span>ホーム</span></button>
      <button class="tab" role="tab" data-wtab="year"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="2"/><path d="M3.5 9h17M8 4.5v-2M16 4.5v-2"/><path d="M7.5 13h3M13.5 13h3M7.5 16.5h3"/></svg><span>年間</span></button>
      <button class="tab" role="tab" data-wtab="links"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>リンク集</span></button>
      <button class="tab" role="tab" data-wtab="docs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9l4 4V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M14.5 3.5V8H19M8.5 12h7M8.5 15.5h7"/></svg><span>手順・メモ</span></button>
      <button class="tab" role="tab" data-wtab="cal"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg><span>カレンダー</span></button>
      <button class="tab" role="tab" data-wtab="set"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>設定</span></button>
    </div>
  </div>
  </div>
  <div class="shell">
    <nav class="side" id="sidenav" aria-label="メニュー"></nav>
    <div class="content">
      <div class="status" id="status" role="status"></div>
      <div id="banner"></div>
      <main id="app"></main>
    </div>
  </div>
</div>

<dialog id="celldlg" aria-label="コマの記録"><div id="cellbody"></div></dialog>

<dialog id="flowdlg" aria-label="単元の予定を流し込む"><div id="flowbody"></div></dialog>

<dialog id="urldlg" aria-label="Google Classroomのリンク"><div id="urlbody"></div></dialog>

<dialog id="carrydlg" aria-label="前の学期から引き継ぐ"><div id="carrybody"></div></dialog>

<dialog id="wimgdlg" aria-label="画像（拡大）"><div class="wimgtop"><span class="seg" style="margin:0"><button data-wzoom="fit" aria-pressed="true">画面いっぱい</button><button data-wzoom="x2" aria-pressed="false">2倍</button><button data-wzoom="x3" aria-pressed="false">3倍</button></span><button class="btn on" id="wimgclose">閉じる</button></div><div class="wimgbox"><img id="wimgbig" alt=""></div></dialog>

<dialog id="wdlg" aria-label="校務"><div id="wbody"></div></dialog>

<dialog id="remdlg" aria-label="記録がまだ入っていない授業"><div id="rembody"></div></dialog>

<dialog id="dlg" aria-labelledby="dlg-title">
  <h2 id="dlg-title">設定</h2>
  <p class="small" style="margin:0 0 4px">GitHubの情報を入れると、記録がこのリポジトリのJSONに自動で保存されます（直すたびにコミットされます）。入れなくても、この端末の中だけで使えます。</p>
  <label for="s_owner">GitHubのユーザー名</label><input type="text" id="s_owner" autocomplete="off" autocapitalize="off">
  <label for="s_repo">リポジトリ名</label><input type="text" id="s_repo" autocomplete="off" autocapitalize="off">
  <label for="s_branch">ブランチ</label><input type="text" id="s_branch" autocomplete="off" autocapitalize="off">
  <label for="s_token">アクセストークン（このリポジトリだけに Contents の読み書きを許可したもの）</label><input type="password" id="s_token" autocomplete="off">
  <p class="small"><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">トークンを作るページを開く（GitHub）</a></p>
  <p class="small" id="s_msg" role="status"></p>
  <div class="dlg-btns" style="justify-content:flex-start">
    <button class="btn" data-act="test">接続を確かめる</button>
    <button class="btn" data-act="export">JSONを書き出す</button>
    <label class="btn" for="importfile" style="margin:0;color:var(--ink);font-size:inherit">JSONを読み込む</label>
    <input type="file" id="importfile" accept="application/json,.json" hidden>
  </div>
  <div class="dlg-btns" style="justify-content:space-between">
    <button class="btn danger" data-act="forget" title="共用のパソコンで使ったあとに押します">この端末の設定を消す</button>
    <span class="btns"><button class="btn" data-act="close-dlg">閉じる</button>
    <button class="btn on" data-act="save-settings">保存して反映</button></span>
  </div>
</dialog>

<script src="js/logic.js?v=2"></script>
<script src="js/storage.js?v=2"></script>
<script src="js/views.js?v=4"></script>
<script src="js/library.js?v=2"></script>
<script src="js/workseed.js?v=3"></script>
<script src="js/work.js?v=14"></script>
<script src="js/main.js?v=4"></script>
</body>
</html>
